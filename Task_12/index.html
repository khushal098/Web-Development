<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

       
        let P = 10000;   
        let r = 0.08;    
        let n = 4;       
        let t = 5;       

        
        let A = P * Math.pow((1 + (r / n)), (n * t));

        
        let CI = A - P;

        console.log("Principal Amount: " + P);
        console.log("Rate of Interest: " + (r * 100) + "%");
        console.log("Compounded per year: " + n);
        console.log("Time period: " + t + " years");
        console.log("Total Amount (A): " + A.toFixed(2));
        console.log("Compound Interest (CI): " + CI.toFixed(2));
    </script>
</body>

</html>
