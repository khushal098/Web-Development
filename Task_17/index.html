<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Division Using Promises</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Division Using Promises</h1>

    <section class="panel">
      <h2>Try it yourself</h2>
      <div class="row">
        <input type="number" id="num1" placeholder="First number" step="any">
        <input type="number" id="num2" placeholder="Second number" step="any">
        <button id="divideBtn">Divide</button>
      </div>
      <p id="userResult" class="user-result"></p>
    </section>

    <section class="panel">
      <h2>Test cases</h2>
      <div id="output"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
