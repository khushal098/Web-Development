<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let number = 5;
        let divisor = 2;
        let remainder = number % divisor;
        let result;


        if (remainder === 0) {
            result = "even";
        } else {
            result = "odd";
        }


        console.log("The number " + number + " is " + result + ".");
    </script>
</body>

</html>
