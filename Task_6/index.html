<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style_1.css"> -->
    <link rel="stylesheet" href="style_2.css">

</head>
<body>
    <div class="container">

        <!-- left side -->
        <div class="left-panel">
            <div class="img-container">
                <img src="image\laundary logo without back.png" alt="image" id="logo">
            </div>
        </div>
   
        <!-- right side -->
        
        <div class="right-panel">
            <div class="login-card">
                <div class="heading">
                    <h1>Hello Again!</h1>
                    <p>we welcome you back</p>
                </div>

                <form>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Emailid@site.com">
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Password">
                    </div>

                    <div class="forgot-password">
                        <a href="#">Forgot Password</a>
                    </div>

                    <button type="submit">
                        Login
                    </button>

                </form>

                <div class="register">
                    <span>Not a member?</span>
                    <a href="#" class="signup">Register Now</a>
                </div>


            </div>
        </div>
    </div>
</body>
</html>
